<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- ==========================================
       ATLAS VECTOR ICON REPOSITORY
       Matching Elite Dangerous In-Game UI Sprites
       ========================================== -->

  <!-- 1. CORIOLIS STARPORT MINIATURE -->
  <symbol id="atlas-icon-coriolis" viewBox="0 0 48 48">
    <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" fill="rgba(255, 113, 0, 0.08)" stroke="#ff7100" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="24,12 34,18 34,30 24,36 14,30 14,18" fill="none" stroke="#ff9800" stroke-width="1.2" stroke-dasharray="3, 2"/>
    <rect x="21" y="21" width="6" height="6" fill="#ff9800"/>
    <line x1="24" y1="4" x2="24" y2="12" stroke="#ff7100" stroke-width="1.2"/>
    <line x1="24" y1="36" x2="24" y2="44" stroke="#ff7100" stroke-width="1.2"/>
    <line x1="6" y1="24" x2="14" y2="24" stroke="#ff7100" stroke-width="1.2"/>
    <line x1="34" y1="24" x2="42" y2="24" stroke="#ff7100" stroke-width="1.2"/>
  </symbol>

  <!-- 2. ORBIS / BERNAL STARPORT MINIATURE -->
  <symbol id="atlas-icon-orbis" viewBox="0 0 48 48">
    <ellipse cx="24" cy="24" rx="20" ry="7" fill="none" stroke="#4fc3f7" stroke-width="1.8" stroke-dasharray="4, 2"/>
    <line x1="24" y1="3" x2="24" y2="45" stroke="#ff7100" stroke-width="2"/>
    <circle cx="24" cy="24" r="8" fill="rgba(255, 113, 0, 0.15)" stroke="#ff9800" stroke-width="2"/>
    <circle cx="24" cy="11" r="3" fill="#ff7100"/>
    <circle cx="24" cy="37" r="4" fill="none" stroke="#ff9800" stroke-width="1.5"/>
  </symbol>

  <!-- 3. OUTPOST MINIATURE -->
  <symbol id="atlas-icon-outpost" viewBox="0 0 48 48">
    <rect x="14" y="14" width="20" height="20" fill="rgba(255, 113, 0, 0.1)" stroke="#ff7100" stroke-width="2"/>
    <rect x="20" y="20" width="8" height="8" fill="#ff9800"/>
    <line x1="6" y1="24" x2="14" y2="24" stroke="#ff7100" stroke-width="2"/>
    <line x1="34" y1="24" x2="42" y2="24" stroke="#ff7100" stroke-width="2"/>
    <line x1="24" y1="6" x2="24" y2="14" stroke="#ff7100" stroke-width="2"/>
  </symbol>

  <!-- 4. PLANETARY SURFACE SETTLEMENT / PORT -->
  <symbol id="atlas-icon-surface-settlement" viewBox="0 0 48 48">
    <path d="M4,40 Q24,32 44,40" fill="none" stroke="#4fc3f7" stroke-width="2"/>
    <polygon points="24,14 34,34 14,34" fill="rgba(255, 152, 0, 0.15)" stroke="#ff9800" stroke-width="2"/>
    <rect x="21" y="26" width="6" height="8" fill="#ff7100"/>
    <circle cx="24" cy="10" r="2" fill="#4fc3f7"/>
  </symbol>

  <!-- 5. FLEET CARRIER LOCATION PIN -->
  <symbol id="atlas-icon-fleet-carrier" viewBox="0 0 48 48">
    <polygon points="24,6 38,38 24,32 10,38" fill="rgba(0, 229, 255, 0.18)" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="24,14 31,30 24,27 17,30" fill="#00e5ff"/>
  </symbol>

  <!-- 6. HORIZONS LANDABLE CRESCENT ARC -->
  <symbol id="atlas-icon-landable-arc" viewBox="0 0 48 48">
    <path d="M8,24 A16,16 0 0,1 40,24" fill="none" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="24" x2="10" y2="24" stroke="#4fc3f7" stroke-width="3"/>
    <line x1="38" y1="24" x2="42" y2="24" stroke="#4fc3f7" stroke-width="3"/>
  </symbol>

  <!-- 7. THARGOID TITAN / MAELSTROM MARKER -->
  <symbol id="atlas-icon-maelstrom" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="18" fill="rgba(0, 230, 118, 0.08)" stroke="#00e676" stroke-width="1.8" stroke-dasharray="4, 3"/>
    <polygon points="24,8 29,19 40,24 29,29 24,40 19,29 8,24 19,19" fill="rgba(0, 230, 118, 0.25)" stroke="#00e676" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="4" fill="#ff1744"/>
  </symbol>

  <!-- 8. SELECTION RETICLE BRACKET -->
  <symbol id="atlas-icon-reticle" viewBox="0 0 48 48">
    <path d="M4,14 L4,4 L14,4" fill="none" stroke="#ff9800" stroke-width="2.5"/>
    <path d="M34,4 L44,4 L44,14" fill="none" stroke="#ff9800" stroke-width="2.5"/>
    <path d="M4,34 L4,44 L14,44" fill="none" stroke="#ff9800" stroke-width="2.5"/>
    <path d="M34,44 L44,44 L44,34" fill="none" stroke="#ff9800" stroke-width="2.5"/>
    <circle cx="24" cy="24" r="2" fill="#ff7100"/>
  </symbol>

  <!-- 9. DEEP SPACE SUPPORT ARRAY (DSSA) AMBER BEACON EMBLEM -->
  <symbol id="atlas-icon-dssa" viewBox="0 0 48 48">
    <polygon points="24,2 44,22 24,42 4,22" fill="rgba(255, 179, 0, 0.15)" stroke="#ffb300" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="24" cy="22" r="14" fill="none" stroke="#ff9100" stroke-width="1.2" stroke-dasharray="3, 2"/>
    <polygon points="24,10 27,19 36,22 27,25 24,34 21,25 12,22 21,19" fill="#ffb300"/>
    <circle cx="24" cy="22" r="3" fill="#fff7c2"/>
    <line x1="24" y1="42" x2="24" y2="47" stroke="#ffb300" stroke-width="2"/>
    <line x1="18" y1="47" x2="30" y2="47" stroke="#ffb300" stroke-width="2"/>
  </symbol>
</svg>
